<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.025em;
        fill: #FFFFFF;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.26em;
        fill: #FFFFFF;
        opacity: 0.95;
        text-transform: uppercase;
      }
    </style>
  </defs>
  <rect width="420" height="110" rx="4" fill="#141414" />
  <text x="50%" y="46" text-anchor="middle" dominant-baseline="central" class="brand-title">Be Corporate</text>
  <text x="50%" y="82" text-anchor="middle" dominant-baseline="central" class="brand-sub">COMMUNICATION BEYOND LANGUAGE</text>
